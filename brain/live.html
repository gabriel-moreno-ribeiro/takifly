<!doctype html>
<html lang="pt-BR">
<!-- live.html - a página do painel ao vivo (brain/live.ts). O desenho é o mesmo do cabeçalho de brain/graph.ts:
     mudou nó ou aresta lá, mude aqui também. Cada nó tem data-no com o nome que o grafo usa. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takifly ao vivo</title>
<style>

	svg { width: 100%; max-width: 760px; height: auto; display: block; }
	.no rect { stroke-width: 1.5; }
	.no text { fill: var(--foreground, #171717); font-size: 15px; font-weight: 600; text-anchor: middle; }
	.no text.det { font-size: 11.5px; font-weight: 400; fill: var(--muted-foreground, #71717a); }
	.codigo rect { fill: rgba(120,120,130,.10); stroke: rgba(120,120,130,.55); stroke-dasharray: 3 3; }
	.forte rect { fill: rgba(37,99,235,.16); stroke: #2563eb; }
	.barato rect { fill: rgba(16,163,74,.12); stroke: #16a34a; }
	.agente rect { fill: rgba(217,70,239,.22); stroke: #c026d3; stroke-width: 3; }
	.ponta rect { fill: var(--card, #fff); stroke: var(--foreground, #171717); }
	.seta { fill: none; stroke: var(--muted-foreground, #71717a); stroke-width: 1.6; }
	.seta.volta { stroke-dasharray: 5 4; }
	.seta.recusa { stroke: var(--destructive, #dc2626); stroke-dasharray: 5 4; }
	.ponteira { fill: var(--muted-foreground, #71717a); }
	.ponteira.vermelha { fill: var(--destructive, #dc2626); }
	.rotulo { font-size: 11.5px; fill: var(--muted-foreground, #71717a); }
	.rotulo.vermelho { fill: var(--destructive, #dc2626); }
	.legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0 6px; font-size: 13px; }
	.legenda span { display: inline-flex; align-items: center; gap: 6px; }
	.cor { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
	.c-codigo { background: rgba(120,120,130,.10); border: 1.5px dashed rgba(120,120,130,.55); }
	.c-forte { background: rgba(37,99,235,.16); border-color: #2563eb; }
	.c-barato { background: rgba(16,163,74,.12); border-color: #16a34a; }
	.c-agente { background: rgba(217,70,239,.22); border-color: #c026d3; border-width: 3px; }
	table { border-collapse: collapse; font-size: 13px; margin-top: 10px; width: 100%; max-width: 760px; }
	td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border, #e4e4e7); }
	th { color: var(--muted-foreground, #71717a); font-weight: 500; }

	body { margin: 0; padding: 16px; background: #fff; color: #171717; font-family: system-ui, sans-serif; }
	header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
	h1 { font-size: 18px; margin: 0; }
	.estado { font-size: 13px; color: #71717a; display: inline-flex; align-items: center; gap: 6px; }
	.ponto { width: 9px; height: 9px; border-radius: 50%; background: #a1a1aa; }
	.ponto.ligado { background: #16a34a; }
	select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; color: inherit; }
	.contas { font-size: 13px; color: #3f3f46; }
	.contas b { font-variant-numeric: tabular-nums; }
	main { display: grid; grid-template-columns: minmax(0, 760px) minmax(280px, 1fr); gap: 16px; align-items: start; }
	@media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
	#grafo.ativo .no[data-no]:not(.rodando):not(.feito):not(.erro) { opacity: .15; }
	#grafo .no.rodando rect { stroke-width: 5; animation: pulsar .7s ease-in-out infinite alternate; }
	#grafo .no.erro rect { stroke: #dc2626; stroke-width: 4; }
	@keyframes pulsar { from { opacity: 1; } to { opacity: .55; } }
	/* as setas e os rótulos: só o caminho que o pedido percorreu fica aceso; o passo de agora corre */
	#grafo.ativo [data-arestas]:not(.usada) { opacity: .07; }
	#grafo.ativo .no[data-ponta]:not(.feito) { opacity: .15; }
	#grafo .seta.usada { stroke: #3f3f46; stroke-width: 2.4; }
	#grafo .seta.recusa.usada { stroke: #dc2626; }
	#grafo .seta.usada.agora, #grafo .seta.agora { stroke: #f59e0b !important; stroke-width: 3; stroke-dasharray: 8 6; animation: correr .45s linear infinite; }
	@keyframes correr { to { stroke-dashoffset: -14; } }
	#bolinha { fill: #f59e0b; filter: drop-shadow(0 0 4px #f59e0b); }
	#grafo .no.rodando rect { filter: drop-shadow(0 0 8px currentColor); }
	li.nova { animation: chegou 1.2s ease-out; }
	@keyframes chegou { from { background: rgba(245,158,11,.35); } to { background: transparent; } }
	#grafo .vezes { font-size: 12px; font-weight: 700; fill: #3f3f46; text-anchor: end; }
	ol { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 1000px; overflow-y: auto; border: 1px solid #e4e4e7; border-radius: 8px; }
	li { padding: 7px 10px; border-bottom: 1px solid #f4f4f5; display: grid; grid-template-columns: 62px 1fr; gap: 2px 8px; }
	li .hora { color: #a1a1aa; font-variant-numeric: tabular-nums; }
	li .nome { font-weight: 600; }
	li .detalhe { grid-column: 2; color: #52525b; overflow-wrap: anywhere; }
	li.inicio .nome { color: #a1a1aa; }
	li.modelo .nome::before { content: "◆ "; color: #a1a1aa; }
	li.erro { background: #fef2f2; }
	li.nota .nome { color: #b45309; }
	li.novo-pedido { border-top: 2px solid #171717; }
	.vazio { padding: 16px; color: #71717a; }
	#contexto { margin-top: 20px; max-width: 1200px; }
	#contexto h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
	#contexto .colunas { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 16px; align-items: start; }
	@media (max-width: 800px) { #contexto .colunas { grid-template-columns: 1fr; } }
	#conversas { list-style: none; margin: 0; padding: 0; border: 1px solid #e4e4e7; border-radius: 8px; font-size: 13px; }
	#conversas li { display: block; padding: 0; }
	#conversas button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 8px 10px; cursor: pointer; }
	#conversas button:hover, #conversas button:focus-visible, #conversas li.escolhida button { background: rgba(37,99,235,.10); }
	#conversas small { display: block; color: #b45309; }
	#retrato { border: 1px solid #e4e4e7; border-radius: 8px; padding: 12px; font-size: 13px; }
	#retrato dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0 0 12px; }
	#retrato dt { color: #71717a; }
	#retrato dd { margin: 0; overflow-wrap: anywhere; }
	.botoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	.botoes button, #contexto h2 button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; color: inherit; cursor: pointer; }
	.botoes button.perigo { border-color: #dc2626; color: #dc2626; }
	.botoes button:disabled { opacity: .5; cursor: wait; }
	@media (prefers-color-scheme: dark) {
		body { background: #18181b; color: #f4f4f5; }
		.no text { fill: #f4f4f5 !important; }
		.ponta rect { fill: #27272a !important; stroke: #a1a1aa !important; }
		.no text.det, .rotulo { fill: #a1a1aa !important; }
		select { background: #27272a; border-color: #3f3f46; }
		.contas { color: #d4d4d8; }
		#grafo .vezes { fill: #e4e4e7; }
		#grafo .seta.usada { stroke: #e4e4e7; }
		#grafo .seta.recusa.usada { stroke: #f87171; }
		ol { border-color: #3f3f46; }
		li { border-bottom-color: #27272a; }
		li .detalhe { color: #a1a1aa; }
		li.erro { background: #450a0a; }
		li.novo-pedido { border-top-color: #f4f4f5; }
		#conversas, #retrato { border-color: #3f3f46; }
		.botoes button, #contexto h2 button { background: #27272a; border-color: #3f3f46; }
	}
</style>
</head>

<script>
	// o que cada nó usa: serve para contar as chamadas de modelo de cada papel
	const FORTES = new Set(["orquestrador", "redator"]);
	// as notas de fora do grafo (fase "nota", brain/live.ts anotarNoPainel): o nome que aparece na lista
	const NOTAS = { planilha: "planilha", espera: "esperando mais mensagens", juiz: "juiz das mensagens", cancelado: "pedido cancelado", contexto: "contexto" };
	const todos = [];             // tudo o que chegou, de todas as conversas
	const conversas = new Set();
	let seguindo = "";           // conversa mostrada; vazio = a última que mexeu
	let ultima = "";

	const grafo = document.getElementById("grafo");
	const nos = new Map([...grafo.querySelectorAll(".no[data-no]")].map((g) => [g.dataset.no, g]));
	// um contador em cada nó: quantas vezes ele rodou neste pedido
	for (const g of nos.values()) {
		const r = g.querySelector("rect");
		const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
		t.setAttribute("class", "vezes");
		t.setAttribute("x", Number(r.getAttribute("x")) + Number(r.getAttribute("width")) - 8);
		t.setAttribute("y", Number(r.getAttribute("y")) + 15);
		g.appendChild(t);
	}

	const setas = [...grafo.querySelectorAll("[data-arestas]")];
	const pontas = Object.fromEntries([...grafo.querySelectorAll("[data-ponta]")].map((g) => [g.dataset.ponta, g]));
	const bolinha = document.createElementNS("http://www.w3.org/2000/svg", "circle");
	bolinha.setAttribute("id", "bolinha");
	bolinha.setAttribute("r", "6");
	bolinha.style.display = "none";    // só aparece quando há um passo correndo
	grafo.appendChild(bolinha);
	let passoAnimado = null;
	let avisosDesenhados = 0;

	// a bolinha corre pela seta do passo de agora, no sentido em que o grafo andou
	function animar(passo) {
		if (passo === passoAnimado) return;
		passoAnimado = passo;
		bolinha.replaceChildren();
		const seta = passo && setas.find((el) => el.tagName === "path" && el.dataset.arestas.split(" ").includes(passo));
		bolinha.style.display = seta ? "" : "none";
		if (!seta) return;
		const ida = seta.dataset.arestas.split(" ")[0] === passo;
		const movimento = document.createElementNS("http://www.w3.org/2000/svg", "animateMotion");
		movimento.setAttribute("dur", "0.9s");
		movimento.setAttribute("repeatCount", "indefinite");
		movimento.setAttribute("keyPoints", ida ? "0;1" : "1;0");
		movimento.setAttribute("keyTimes", "0;1");
		movimento.setAttribute("calcMode", "linear");
		const caminho = document.createElementNS("http://www.w3.org/2000/svg", "mpath");
		caminho.setAttribute("href", "#" + seta.id);
		movimento.appendChild(caminho);
		bolinha.appendChild(movimento);
		movimento.beginElement?.();
	}

	const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR");
	const nomeCurto = (conversa) => conversa.length > 18 ? conversa.slice(0, 8) + "…" + conversa.slice(-6) : conversa;

	// redesenha tudo a partir dos avisos da conversa mostrada: o último pedido acende no grafo, a linha do tempo lista
	function desenhar() {
		const atual = seguindo || ultima;
		const daConversa = todos.filter((a) => a.conversa === atual);
		const inicioDoPedido = daConversa.findLastIndex((a) => a.no === "preparar" && a.fase === "inicio");
		const pedido = inicioDoPedido === -1 ? [] : daConversa.slice(inicioDoPedido);

		const vezes = new Map(), rodando = new Set(), feito = new Set(), erro = new Set();
		let fortes = 0, baratos = 0;
		for (const a of pedido) {
			if (a.fase === "inicio") { rodando.add(a.no); erro.delete(a.no); vezes.set(a.no, (vezes.get(a.no) ?? 0) + 1); }
			if (a.fase === "fim") { rodando.delete(a.no); feito.add(a.no); }
			if (a.fase === "erro") { rodando.delete(a.no); erro.add(a.no); }
			if (a.fase === "modelo") FORTES.has(a.no) ? fortes++ : baratos++;
		}
		grafo.classList.toggle("ativo", pedido.length > 0);
		for (const [nome, g] of nos) {
			g.classList.toggle("rodando", rodando.has(nome));
			g.classList.toggle("feito", feito.has(nome));
			g.classList.toggle("erro", erro.has(nome));
			g.querySelector(".vezes").textContent = (vezes.get(nome) ?? 0) > 1 ? "×" + vezes.get(nome) : "";
		}
		const acabou = pedido.some((a) => a.no === "lembrar" && a.fase === "fim");
		const terminou = acabou || pedido.at(-1)?.fase === "erro";
		// os caminhos percorridos: de cada nó que começou para o próximo. O último é o passo de agora
		const usadas = new Set();
		let anterior = "inicio", passo = "";
		for (const a of pedido) if (a.fase === "inicio") { passo = anterior + ">" + a.no; usadas.add(passo); anterior = a.no; }
		if (acabou) usadas.add("lembrar>fim");
		if (terminou) passo = "";
		for (const el of setas) {
			const dela = el.dataset.arestas.split(" ");
			el.classList.toggle("usada", dela.some((aresta) => usadas.has(aresta)));
			el.classList.toggle("agora", el.tagName === "path" && dela.includes(passo));
		}
		pontas.inicio.classList.toggle("feito", pedido.length > 0);
		pontas.fim.classList.toggle("feito", acabou);
		animar(passo);
		const segundos = pedido.length ? Math.round(((terminou ? new Date(pedido.at(-1).hora) : new Date()) - new Date(pedido[0].hora)) / 1000) : 0;
		document.getElementById("contas").innerHTML = pedido.length
			? `último pedido: <b>${fortes}</b> chamada(s) {{FORTE}} · <b>${baratos}</b> {{BARATO}} · <b>${segundos}</b> s${terminou ? "" : " e contando"}`
			: "";

		const linha = document.getElementById("linha");
		// o começo de um nó só serve para medir quanto ele levou: na lista fica o fim, com o tempo
		const comecou = new Map();
		for (const a of daConversa) {
			if (a.fase === "inicio") comecou.set(a.no, a.hora);
			else if (a.fase === "fim" || a.fase === "erro") a.levou = comecou.has(a.no) ? (new Date(a.hora) - new Date(comecou.get(a.no))) / 1000 : null;
		}
		const chegouAgora = todos.length !== avisosDesenhados;
		avisosDesenhados = todos.length;
		const ultimos = daConversa.filter((a) => a.fase !== "inicio" || a.no === "preparar").slice(-150).reverse();
		if (ultimos.length === 0) return;
		linha.replaceChildren(...ultimos.map((a) => {
			const li = document.createElement("li");
			li.className = a.fase + (a.no === "preparar" && a.fase === "inicio" ? " novo-pedido" : "") + (chegouAgora && a === ultimos[0] ? " nova" : "");
			const nome = a.fase === "modelo" ? `${a.no} chamou o modelo ${a.detalhe}` : a.fase === "inicio" ? "pedido novo" : a.fase === "nota" ? NOTAS[a.no] ?? a.no : a.no + (a.levou != null ? ` · ${a.levou.toFixed(1).replace(".", ",")} s` : "");
			const textos = [["hora", hora(a.hora)], ["nome", nome], ["detalhe", a.fase === "modelo" ? "" : a.detalhe]];
			for (const [classe, texto] of textos) {
				if (!texto) continue;
				const s = document.createElement("span");
				s.className = classe;
				s.textContent = texto;
				li.appendChild(s);
			}
			// só link https vira clicável: o texto do aviso nunca entra como HTML
			if (/^https:\/\//.test(a.link ?? "")) {
				const link = document.createElement("a");
				link.className = "detalhe";
				link.href = a.link;
				link.target = "_blank";
				link.rel = "noopener";
				link.textContent = "abrir a planilha";
				li.appendChild(link);
			}
			return li;
		}));
	}

	function ouvir() {
		const fonte = new EventSource("/eventos");
		fonte.onopen = () => { todos.length = 0; document.getElementById("ponto").classList.add("ligado"); document.getElementById("estado").textContent = "ligado ao bot"; };
		fonte.onerror = () => { document.getElementById("ponto").classList.remove("ligado"); document.getElementById("estado").textContent = "sem conexão (o bot está ligado?)"; };
		fonte.onmessage = (mensagem) => {
			const aviso = JSON.parse(mensagem.data);
			todos.push(aviso);
			if (todos.length > 2000) todos.splice(0, todos.length - 2000);
			// alguém compactou ou excluiu: a lista de conversas avisa
			if (aviso.fase === "nota" && aviso.no === "contexto") {
				ultimaAcao.set(aviso.conversa, { texto: aviso.detalhe.split(":")[0], hora: aviso.hora });
				carregarConversas();
			}
			// com dois canais ao mesmo tempo, "a última que mexeu" só troca quando um pedido novo começa
			if (!ultima || (aviso.no === "preparar" && aviso.fase === "inicio")) ultima = aviso.conversa;
			if (!conversas.has(aviso.conversa)) {
				conversas.add(aviso.conversa);
				const opcao = new Option(nomeCurto(aviso.conversa), aviso.conversa);
				document.getElementById("conversa").appendChild(opcao);
			}
			desenhar();
		};
	}
	// ---------- as conversas e o contexto (brain/context.ts, pelas rotas /conversas de brain/live.ts) ----------
	const ultimaAcao = new Map();    // conversa → o último compactar ou excluir, para avisar na lista
	let escolhida = "";
	const elemento = (tag, texto, classe) => { const el = document.createElement(tag); if (texto != null) el.textContent = texto; if (classe) el.className = classe; return el; };

	async function carregarConversas() {
		const lista = document.getElementById("conversas");
		try {
			const conversasGuardadas = await (await fetch("/conversas")).json();
			if (!Array.isArray(conversasGuardadas) || conversasGuardadas.length === 0) return lista.replaceChildren(elemento("li", "nenhuma conversa ainda", "vazio"));
			lista.replaceChildren(...conversasGuardadas.map((conversa) => {
				const li = elemento("li", null, conversa === escolhida ? "escolhida" : "");
				const botao = elemento("button", nomeCurto(conversa));
				botao.type = "button";
				botao.title = conversa;
				botao.onclick = () => mostrarRetrato(conversa);
				const acao = ultimaAcao.get(conversa);
				if (acao) botao.appendChild(elemento("small", `${acao.texto} às ${hora(acao.hora)}`));
				li.appendChild(botao);
				return li;
			}));
		} catch {
			lista.replaceChildren(elemento("li", "não consegui ler as conversas (o bot está ligado?)", "vazio"));
		}
	}

	async function mostrarRetrato(conversa) {
		escolhida = conversa;
		carregarConversas();
		const caixa = document.getElementById("retrato");
		let r;
		try {
			r = await (await fetch("/conversas/" + encodeURIComponent(conversa))).json();
		} catch {
			return caixa.replaceChildren(elemento("span", "não consegui ler esta conversa", "vazio"));
		}
		const lista = (itens, vazio) => (itens && itens.length ? itens.join("; ") : vazio);
		const d = r.dossie;
		const documentos = d ? [`nacionalidade ${d.nacionalidade}`, d.passaporte_validade && `passaporte até ${d.passaporte_validade}`, d.nascimento && `nascimento ${d.nascimento}`, d.vacina_febre_amarela && `febre amarela ${d.vacina_febre_amarela}`].filter(Boolean) : [];
		const dl = elemento("dl");
		const linhas = [
			["Conversa", r.conversa],
			["Mensagens", `${r.naJanela} na janela${r.foraDaJanela ? `, ${r.foraDaJanela} já saíram (só pelo resumo)` : ""}${r.pedidoPelaMetade ? " · um pedido parou no meio" : ""}`],
			["Resumo", r.resumo || "nenhum ainda"],
			["Preferências", lista(r.preferencias, "nenhuma")],
			["Documentos", lista(documentos, "nenhum")],
			["Monitoramentos", lista(r.monitoramentos, "nenhum")],
			["Voos (últimas 6 h)", String(r.voos ?? 0)],
		];
		for (const [rotulo, valor] of linhas) dl.append(elemento("dt", rotulo), elemento("dd", valor));
		const planilhas = elemento("dd", (r.planilhas ?? []).length ? null : "nenhuma");
		for (const p of r.planilhas ?? []) {
			if (!/^https:\/\//.test(p.link)) continue;
			const a = elemento("a", p.nome);
			a.href = p.link; a.target = "_blank"; a.rel = "noopener";
			planilhas.append(a, " ");
		}
		dl.append(elemento("dt", "Planilhas"), planilhas);
		const botoes = elemento("div", null, "botoes");
		const situacao = elemento("span", "", "estado");
		situacao.setAttribute("role", "status");
		for (const [qual, rotulo, classe] of [["compactar", "Compactar", ""], ["excluir", "Excluir", "perigo"]]) {
			const botao = elemento("button", rotulo, classe);
			botao.type = "button";
			botao.onclick = () => agir(conversa, qual, botoes, situacao);
			botoes.appendChild(botao);
		}
		botoes.appendChild(situacao);
		caixa.replaceChildren(dl, botoes);
	}

	async function agir(conversa, qual, botoes, situacao) {
		if (qual === "excluir" && !confirm("Excluir esta conversa? Apago as mensagens, o resumo e os voos. Preferências, documentos, monitoramentos e planilhas ficam.")) return;
		for (const b of botoes.querySelectorAll("button")) b.disabled = true;
		situacao.textContent = "trabalhando… (espera o pedido que estiver rodando terminar)";
		try {
			const corpo = await (await fetch(`/conversas/${encodeURIComponent(conversa)}/${qual}`, { method: "POST" })).json();
			// a pessoa pode ter clicado em outra conversa enquanto esperava: a frase só aparece na conversa certa
			if (escolhida !== conversa) return;
			await mostrarRetrato(conversa);
			document.querySelector("#retrato .botoes .estado").textContent = corpo.texto ?? corpo.erro ?? "";
		} catch {
			situacao.textContent = "não deu certo (o bot está ligado?)";
			for (const b of botoes.querySelectorAll("button")) b.disabled = false;
		}
	}
	document.getElementById("atualizar").onclick = carregarConversas;
	carregarConversas();

	document.getElementById("conversa").onchange = (evento) => { seguindo = evento.target.value; desenhar(); };
	setInterval(() => { if (document.querySelector(".no.rodando")) desenhar(); }, 1000);    // o tempo do pedido anda
	ouvir();
</script>
