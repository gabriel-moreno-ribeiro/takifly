# tests.yml - roda node quality/tests.ts em todo push e pull request: sem .env, sem segredo e sem crédito da Ollama
name: testes

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node quality/tests.ts
